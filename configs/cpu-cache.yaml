seed: 42
data:
  root: data/dr_dataset
  cache_dir: data/cache
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32
  num_workers: 2
preprocess:
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
train:
  model: reference_cnn
  epochs: 5
  lr: 0.001
  amp: false
  weight_decay: 0.0
  label_smoothing: 0.0

